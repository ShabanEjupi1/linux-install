services:
  # XMPP server
  prosody:
    image: jitsi/prosody:stable
    container_name: jitsi_prosody
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - GLOBAL_MODULES=statistics,alert
      - GLOBAL_CONFIG=statistics_interval = "manual"
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_GUEST_DOMAIN=guest.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_MUC_DOMAIN=muc.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_MODULES=
      - XMPP_MUC_MODULES=
      - XMPP_INTERNAL_MUC_MODULES=
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JIBRI_XMPP_PASSWORD}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JIBRI_RECORDER_PASSWORD}
      - TZ=${TZ:-Europe/Tirane}
    volumes:
      - prosody_config:/config
      - prosody_plugins:/prosody-plugins-custom
    networks:
      - jitsi

  # Focus component
  jicofo:
    image: jitsi/jicofo:stable
    container_name: jitsi_jicofo
    restart: unless-stopped
    environment:
      - AUTH_TYPE=internal
      - BRIDGE_AVG_PARTICIPANT_STRESS=0.9
      - BRIDGE_STRESS_THRESHOLD=0.8
      - ENABLE_AUTH=1
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS=1
      - JICOFO_CONF_INITIAL_PARTICIPANT_WAIT_TIMEOUT=15
      - JICOFO_CONF_SINGLE_PARTICIPANT_TIMEOUT=120
      - JICOFO_ENABLE_ICE_FAILURE_DETECTION=1
      - TZ=${TZ:-Europe/Tirane}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_MUC_DOMAIN=muc.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_SERVER=prosody
    depends_on:
      - prosody
    networks:
      - jitsi
    volumes:
      - jicofo_config:/config

  # Video bridge
  jvb:
    image: jitsi/jvb:stable
    container_name: jitsi_jvb
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
      - "3478:3478/udp"
    environment:
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_STUN_SERVERS=meet-jit-si-turnrelay.jitsi.net:443
      - DOCKER_HOST_ADDRESS=${PUBLIC_IP:-185.174.211.45}
      - TZ=${TZ:-Europe/Tirane}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_SERVER=prosody
    depends_on:
      - prosody
    networks:
      - jitsi
    volumes:
      - jvb_config:/config

  # Web frontend
  web:
    image: jitsi/web:stable
    container_name: jitsi_web
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - ENABLE_LETSENCRYPT=0
      - DISABLE_HTTPS=1
      - PUBLIC_URL=https://meet.shabanejupi.tech
      - TZ=${TZ:-Europe/Tirane}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_AUTH_DOMAIN=auth.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_BOSH_URL_BASE=http://prosody:5280
      - XMPP_GUEST_DOMAIN=guest.${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_MUC_DOMAIN=muc.${XMPP_DOMAIN:-meet.jitsi}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JIBRI_XMPP_PASSWORD}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JIBRI_RECORDER_PASSWORD}
    depends_on:
      - prosody
    networks:
      - jitsi
    volumes:
      - web_config:/config
      - web_transcripts:/usr/share/jitsi-meet/transcripts

volumes:
  prosody_config:
  prosody_plugins:
  jicofo_config:
  jvb_config:
  web_config:
  web_transcripts:

networks:
  jitsi:
    driver: bridge
