# KosovaPOS Blazor web — deploy on Ampere alongside the existing stack.
# Ships with its OWN dedicated Postgres (fully isolated from Supabase / pos-web).
#
# One database per business. On boot the app creates the control database
# (pos_control), registers the existing `kosovapos` database as the primary
# business under POS_PRIMARY_BUSINESS_CODE, and migrates every business it finds.
# New businesses are created from /admin/bizneset, which needs the app's Postgres
# role to be able to CREATE DATABASE — `pos` is this container's bootstrap
# superuser, so it can.
#
# Set POSTGRES_PASSWORD and POS_PLATFORM_ADMIN_PASSWORD in a .env file next to
# this compose file. Without the latter, a random platform password is generated
# and written once to the container log.
services:
  pos-blazor-db:
    image: postgres:16-alpine
    container_name: pos-blazor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosovapos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pos-blazor-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d kosovapos"]
      interval: 10s
      timeout: 5s
      retries: 5

  pos-blazor:
    build: .
    image: kosovapos-web:latest
    container_name: pos-blazor
    restart: unless-stopped
    depends_on:
      pos-blazor-db:
        condition: service_healthy
    environment:
      # Template: Database= is swapped per business. The database it names is the
      # primary business, whose data predates multi-business and never moved.
      POS_DB_CONNECTION: "Host=pos-blazor-db;Port=5432;Database=kosovapos;Username=pos;Password=${POSTGRES_PASSWORD}"
      # The login code the existing shop's users must now type. Changing it after
      # the first boot does nothing — adoption only runs while the registry is empty.
      # (The live business was re-coded from "bmd" to the fiscal number directly in
      # the control DB; this value only matters for a fresh, empty deployment.)
      POS_PRIMARY_BUSINESS_CODE: "811274183"
      # Per-business subdomains: each shop is served at pos-<code>.<POS_BASE_HOST>.
      # One-time DNS + tunnel setup in pos-blazor/deploy/subdomains.md.
      POS_BASE_HOST: "spacecode.tech"
      POS_HOST_PREFIX: "pos-"
      # Share the auth cookie across every pos-<code>.spacecode.tech so an apex login
      # redirects to the shop's own subdomain already signed in, and a platform admin
      # can impersonate into a shop on its host. The bizid-vs-host middleware still
      # refuses one shop's session on another shop's host.
      POS_COOKIE_DOMAIN: ".spacecode.tech"
      POS_PLATFORM_ADMIN_USER: "platform"
      POS_PLATFORM_ADMIN_PASSWORD: ${POS_PLATFORM_ADMIN_PASSWORD:-}
      POS_KEYS_DIR: /keys
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      # ── Online shop ────────────────────────────────────────────────────
      # Product photos are data the shop creates, so they live on a volume, not in the
      # image — a redeploy replaces the image and would take wwwroot with it.
      POS_MEDIA_DIR: /media

      # Order mail goes out through the business's own Mailcow (which relays via Brevo),
      # so it is DKIM-signed by the sending domain instead of landing in spam.
      POS_SMTP_HOST: ${POS_SMTP_HOST:-}
      POS_SMTP_PORT: ${POS_SMTP_PORT:-587}
      POS_SMTP_USER: ${POS_SMTP_USER:-}
      POS_SMTP_PASSWORD: ${POS_SMTP_PASSWORD:-}
      POS_SMTP_FROM: ${POS_SMTP_FROM:-}
      POS_SMTP_FROM_NAME: ${POS_SMTP_FROM_NAME:-}

      # PAYPAL_ENVIRONMENT=production means this moves real money. There is no test mode
      # hiding behind a flag: if it is live, it is live.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
    volumes:
      - pos-keys:/keys
      - pos-media:/media
    ports:
      - "127.0.0.1:8121:8080"   # nginx/tunnel proxies to this (pos-web uses 8120)

volumes:
  pos-keys:
  pos-media:
  pos-blazor-pg:
