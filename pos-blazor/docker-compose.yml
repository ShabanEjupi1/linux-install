# KosovaPOS Blazor web — deploy on Ampere alongside the existing stack.
# Ships with its OWN dedicated Postgres (fully isolated from Supabase / pos-web).
# The app self-provisions its schema (EF migrate) and seeds admin/admin on first
# run. Set POSTGRES_PASSWORD in a .env file next to this compose file.
services:
  pos-blazor-db:
    image: postgres:16-alpine
    container_name: pos-blazor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kosovapos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pos-blazor-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d kosovapos"]
      interval: 10s
      timeout: 5s
      retries: 5

  pos-blazor:
    build: .
    image: kosovapos-web:latest
    container_name: pos-blazor
    restart: unless-stopped
    depends_on:
      pos-blazor-db:
        condition: service_healthy
    environment:
      POS_DB_CONNECTION: "Host=pos-blazor-db;Port=5432;Database=kosovapos;Username=pos;Password=${POSTGRES_PASSWORD}"
      POS_KEYS_DIR: /keys
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - pos-keys:/keys
    ports:
      - "127.0.0.1:8121:8080"   # nginx/tunnel proxies to this (pos-web uses 8120)

volumes:
  pos-keys:
  pos-blazor-pg:
