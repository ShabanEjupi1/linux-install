# nginx site for the KosovaPOS Blazor web app.
# Blazor Server keeps a persistent WebSocket (/_blazor) — the Upgrade/Connection
# headers below are REQUIRED or the app falls back to long-polling / breaks.
#
# Multi-business: every shop is reached at pos-<code>.spacecode.tech, plus the
# apex pos.spacecode.tech (code-field login + platform admin). One server block
# serves them all — the app resolves the business from the Host header, which is
# why `proxy_set_header Host $host` (preserving the original hostname) is not
# optional here. The regex server_name matches `pos-<label>` and bare `pos`.
server {
    listen 80;
    server_name ~^(pos-[a-z0-9_]+|pos)\.spacecode\.tech$;

    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 100s;
    }
}

