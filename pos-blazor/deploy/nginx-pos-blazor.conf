# nginx site for the KosovaPOS Blazor web app.
# Blazor Server keeps a persistent WebSocket (/_blazor) — the Upgrade/Connection
# headers below are REQUIRED or the app falls back to long-polling / breaks.
#
# During build-out, serve this on a STAGING host (pos-next.spacecode.tech) so the
# live React app at pos.spacecode.tech keeps running. Flip server_name to
# pos.spacecode.tech only at cut-over.
server {
    listen 80;
    server_name pos-next.spacecode.tech;   # → pos.spacecode.tech at cut-over

    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 100s;
    }
}

