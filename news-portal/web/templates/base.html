<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpaceNews{% endblock %}</title>
<style>
  :root {
    --bg: #0e1015; --surface: #171a21; --surface-2: #1f232c;
    --line: #2b303b; --text: #e7e9ee; --muted: #939aab;
    --brand: #6C4DF6; --good: #3fb950; --ok: #5b9bd5;
    --warn: #d29922; --bad: #f0645d;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5;
      --line: #dfe3e9; --text: #14171d; --muted: #5d6577;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

  header { border-bottom: 1px solid var(--line); background: var(--surface); }
  .head { display: flex; align-items: center; gap: 14px; padding: 18px 0; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 20px; text-decoration: none; letter-spacing: -.02em; }
  .logo span { color: var(--brand); }
  .head nav { margin-left: auto; display: flex; gap: 18px; font-size: 14px; }
  .head nav a { color: var(--muted); text-decoration: none; }
  .head nav a:hover { color: var(--text); }

  .note {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin: 22px 0;
    font-size: 14px; color: var(--muted);
  }
  .note strong { color: var(--text); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 8px; font-size: 17px; line-height: 1.4; }
  .card h2 a { text-decoration: none; }
  .card h2 a:hover { color: var(--brand); }

  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 999px; padding: 4px 11px;
    font-size: 12.5px; font-weight: 600; border: 1px solid;
  }
  .badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
  .badge.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, transparent);   background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .badge.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 40%, transparent);  background: color-mix(in srgb, var(--bad) 10%, transparent); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
  .filters a {
    font-size: 13px; text-decoration: none; padding: 5px 12px;
    border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
  }
  .filters a.on { background: var(--brand); border-color: var(--brand); color: #fff; }

  .why { font-size: 14.5px; color: var(--muted); margin: 12px 0 0;
         padding-left: 12px; border-left: 2px solid var(--line); }

  /* Kartë me avatar: rreshti [monogram] [përmbajtja]. Asnjë imazh i palës së
     tretë — avatari gjenerohet nga emri, prova nga nota. Vetëm të dhënat tona. */
  .item { display: flex; gap: 14px; align-items: flex-start; }
  .avatar {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 11px;
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    color: #fff; letter-spacing: -.02em; user-select: none;
    background: linear-gradient(135deg,
      hsl(var(--h) 58% 52%), hsl(calc(var(--h) + 24) 58% 44%));
  }
  .item-body { min-width: 0; flex: 1; }

  /* Shiriti i provës: katër segmente, gjerësia = pesha, mbushja = nota. */
  .evidence { display: flex; gap: 3px; height: 7px; margin: 12px 0 2px;
              border-radius: 999px; overflow: hidden; }
  .seg { position: relative; background: color-mix(in srgb, var(--muted) 22%, transparent);
         border-radius: 999px; }
  .seg > i { position: absolute; inset: 0; border-radius: 999px; display: block; }
  .seg.good > i { background: var(--good); } .seg.ok > i { background: var(--ok); }
  .seg.warn > i { background: var(--warn); } .seg.bad > i { background: var(--bad); }
  .evidence-key { font-size: 11.5px; color: var(--muted); display: flex;
                  gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .evidence-key b { color: var(--text); font-weight: 600; }

  /* Pika korroborimi: sa redaksi të pavarura, në pamje. */
  .pips { display: inline-flex; gap: 3px; align-items: center; }
  .pips i { width: 6px; height: 6px; border-radius: 999px; background: var(--good); display: block; }
  .pips i.off { background: color-mix(in srgb, var(--muted) 35%, transparent); }

  .preview { font-size: 14px; color: var(--muted); margin: 10px 0 0;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; }

  footer { color: var(--muted); font-size: 13px; padding: 40px 0;
           border-top: 1px solid var(--line); margin-top: 40px; }

  @media (max-width: 560px) { .head nav { width: 100%; margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <a class="logo" href="/">Space<span>News</span></a>
    <nav>
      <a href="/">Lajmet</a>
      <a href="/metoda">Si vlerësohet</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {% block body %}{% endblock %}
</main>

<footer class="wrap">
  <p>
    SpaceNews vlerëson <strong>sa e mbështetur me prova</strong> është një histori —
    jo nëse është e vërtetë. Asnjë sistem automatik nuk mund ta bëjë këtë të fundit.
    Lexo <a href="/metoda">metodën</a> para se t'i besosh një note.
  </p>
</footer>
</body>
</html>
