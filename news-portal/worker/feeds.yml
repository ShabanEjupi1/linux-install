# Burimet e lajmeve. `tier` ushqen vlerësimin e besueshmërisë së burimit.
#
# tier: wire      -> agjenci lajmesh, standard redaktues i dokumentuar, korrigjime publike
# tier: mainstream-> media e themeluar me redaksi dhe pronësi të njohur
# tier: local     -> media vendore e njohur, redaksi më e vogël
# tier: unrated   -> e panjohur; nuk merr asnjë kredit paraprak
#
# `tier` NUK do të thotë "e vërtetë". Do të thotë sa shumë provë të jashtme
# na duhet para se ta besojmë. Wire-i ende gabon; unrated-i ende ka të drejtë.

# Të verifikuara si të gjalla më 2026-07-16. Reuters u hoq: RSS-ja publike e
# tyre është ndërprerë (feeds.reuters.com s'ekziston më, endpoint-i i ri kthen
# 401). Nëse dikur rikthehet, është kandidati i parë për t'u shtuar prapa.

sources:
